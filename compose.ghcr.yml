name: bilskirnir

services:
  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/co3moz/bilskirnir:latest}
    container_name: ${MANAGER_CONTAINER:-bilskirnir-manager}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    labels:
      io.wsl-desktop.manager: "true"
    environment:
      MANAGER_CONTAINER: ${MANAGER_CONTAINER:-bilskirnir-manager}
      AUTH_MODE: ${AUTH_MODE:-password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-token}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      DESKTOP_IMAGE: ${DESKTOP_IMAGE:-ghcr.io/co3moz/bilskirnir/ubuntu-xfce:24.04}
      WSL_GPU: ${WSL_GPU:-true}
      NVIDIA_COMPUTE: ${NVIDIA_COMPUTE:-true}
      GPU_ADAPTER: ${GPU_ADAPTER:-}
      AUDIO_ENABLED: ${AUDIO_ENABLED:-true}
      MICROPHONE_ENABLED: ${MICROPHONE_ENABLED:-true}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-1024}
      IMAGE_ARCHIVE_MAX_MB: ${IMAGE_ARCHIVE_MAX_MB:-65536}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost},${DESKTOP_HOST:-localhost}
      RUST_LOG: ${RUST_LOG:-bilskirnir=info,tower_http=info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manager-data:/data
    networks:
      - management

  # Desktop profile images are not services: the manager downloads each one
  # the first time a desktop is created from it, and shows the progress.

  https:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      DESKTOP_HOST: ${DESKTOP_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - management
    depends_on:
      - manager

networks:
  management:
volumes:
  manager-data:
    name: ${MANAGER_DATA_VOLUME:-bilskirnir-data}
  caddy-data:
  caddy-config:
